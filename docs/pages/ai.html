<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI — Coming Soon — Abastel</title>
  <meta name="description" content="Abastel's AI vertical — coming soon. Get in touch to be the first to know when we launch." />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .ai-coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-l) 0;
    }
    .ai-coming-soon img {
      max-width: 480px;
      width: 100%;
      height: auto;
      border-radius: 20px;
      margin-bottom: var(--space-l);
    }
    /* ── PAGE HERO WITH BACKGROUND IMAGE ── */
    .ai-hero {
      position: relative;
      min-height: 520px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #0a1628;
    }
    .ai-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('../Media/Banner%20images/Ai.PNG');
      background-size: cover;
      background-position: center;
      opacity: 0.6;
    }
    .ai-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,10,30,0.7) 40%, rgba(0,10,30,0.15) 100%);
    }
    .ai-hero-content {
      position: relative;
      z-index: 2;
      padding: 6rem 0 5rem;
    }
  </style>
</head>
<body data-page="ai">

  <!-- ── HERO WITH BACKGROUND IMAGE ── -->
  <section class="ai-hero">
    <div class="ai-hero-bg"></div>
    <div class="ai-hero-overlay"></div>
    <div class="container ai-hero-content fade-up">
      <div class="breadcrumb">
        <a href="../index.html" style="color:rgba(255,255,255,0.5)">Home</a>
        <span class="sep" style="color:rgba(255,255,255,0.3)">/</span>
        <span style="color:rgba(255,255,255,0.5)">Verticals</span>
        <span class="sep" style="color:rgba(255,255,255,0.3)">/</span>
        <span style="color:rgba(255,255,255,0.7)">AI</span>
      </div>
      <p class="tag" style="margin-top:1.5rem">Vertical — AI</p>
      <h1 class="display-xl" style="max-width:680px;margin-top:1rem;color:#fff">
        Something intelligent<br>is on its way.
      </h1>
      <p class="body-lg" style="color:rgba(255,255,255,0.58);max-width:540px;margin-top:1.5rem">
        Abastel is building an AI vertical. We're not ready to share details yet — but we will be soon.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container ai-coming-soon fade-up">
      <img src="../AI/AI%20comming%20soon.png" alt="Abastel AI — coming soon" />
      <p class="body-lg" style="max-width:560px">
        We're working on something new. Want to be the first to hear about it?
      </p>
      <a href="contact.html" class="btn btn-primary" style="margin-top:1.5rem">Get Notified →</a>
    </div>
  </section>

  <script src="../js/shared.js"></script>
  <script src="../js/animations.js"></script>
</body>
</html>
